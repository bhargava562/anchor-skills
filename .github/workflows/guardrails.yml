name: guardrails

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Security Audit
        run: python scripts/security_audit.py

      - name: Run Skills Validation
        run: python scripts/validate_skills.py

      - name: Run Skills Bundling
        run: python scripts/bundle_skills.py
